# Render Blueprint: Cairn as a static site (New > Blueprint, pick this repo).
# Render asks for the two sync: false values on first deploy; use the ones from your .env.
# Never add SUPABASE_SERVICE_ROLE_KEY or SUPABASE_DB_URL here: anything VITE_-prefixed is bundled into the public site,
# and the site needs nothing else.
services:
  - type: web
    name: cairn
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    # A single-page app: any path that isn't a real file (/g/<id>, /sign-in, /auth/callback) serves index.html.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /models/*
        name: Cache-Control
        value: public, max-age=86400, stale-while-revalidate=604800
